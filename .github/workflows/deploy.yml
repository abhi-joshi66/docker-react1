name: Deploy Frontend
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.dev
          push: false
          load: true
          tags: frontend1:latest

      - name: Run tests
        run: docker run --rm frontend1:latest npm test -- --watchAll=false --passWithNoTests

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: Frontend2
          environment_name: Frontend2-env
          existing_bucket_name: elasticbeanstalk-ap-south-1-720646471511
          region: ap-south-1
         version_label: ${{ github.sha }}-${{ github.run_number }}
          deployment_package: deploy.zip
